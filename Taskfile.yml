version: "3"

dotenv:
  - .env
  - .env.example

vars:
  API_URL:
    sh: |
      fqdn="{{.BUBLIK_FQDN}}"
      prefix="{{.URL_PREFIX}}"
      port="{{.BUBLIK_DOCKER_PROXY_PORT}}"
      fqdn="${fqdn%/}"
      prefix="${prefix#/}"
      prefix="${prefix%/}"
      if [ "$port" = "80" ] || [ "$port" = "443" ]; then
        if [ -n "$prefix" ]; then
          echo "$fqdn/$prefix"
        else
          echo "$fqdn"
        fi
      else
        if [ -n "$prefix" ]; then
          echo "$fqdn:$port/$prefix"
        else
          echo "$fqdn:$port"
        fi
      fi
  BACKUP_DIR:
    sh: echo "${CLI_ARGS:-backups}"
  LOGS_URL:
    sh: |
      fqdn="{{.BUBLIK_FQDN}}"
      prefix="{{.URL_PREFIX}}"
      port="{{.BUBLIK_DOCKER_PROXY_PORT}}"
      fqdn="${fqdn%/}"
      prefix="${prefix#/}"
      prefix="${prefix%/}"
      if [ "$port" = "80" ] || [ "$port" = "443" ]; then
        if [ -n "$prefix" ]; then
          echo "$fqdn/$prefix/logs/"
        else
          echo "$fqdn/logs/"
        fi
      else
        if [ -n "$prefix" ]; then
          echo "$fqdn:$port/$prefix/logs/"
        else
          echo "$fqdn:$port/logs/"
        fi
      fi

  ###########################################
  #         E2E                             #
  ###########################################
  # Prefixed, because these share a namespace with everything above: COMPOSE
  # and PROJECT would read as the production stack's, and E2E_COMPOSE_FILES is
  # doubly confusing unprefixed — it is also an env var scripts/e2e_ready.sh
  # reads. The env var names these feed are never prefixed; only the Task-side
  # names are.
  E2E_MANIFEST: '{{.BUBLIK_E2E_MANIFEST | default ".e2e/e2e-manifest.json"}}'
  E2E_PLAN: '{{.BUBLIK_E2E_PLAN_FILE | default "e2e/plan.yaml"}}'
  E2E_DATA_DIR: '{{.BUBLIK_E2E_DATA_DIR | default (printf "%s/e2e" .BUBLIK_DOCKER_DATA_DIR)}}'
  E2E_PUBLISH_DIR: '{{.BUBLIK_E2E_PUBLISH_DIR | default (printf "%s/logs/logs/e2e" .E2E_DATA_DIR)}}'
  # Converted Playwright results live beside the fixtures, never inside them:
  # seeding replaces the whole fixture publish directory, while accumulating
  # result runs across reseeds is the entire point.
  E2E_RESULTS_DIR: '{{.BUBLIK_E2E_RESULTS_DIR | default (printf "%s/logs/logs/e2e-results" .E2E_DATA_DIR)}}'
  E2E_RUN_LOG_SCHEMA: bublik/bublik/data/schemas/run_log.json
  E2E_META_DATA_SCHEMA: bublik/bublik/data/schemas/meta_data.json
  E2E_NORMAL_PROJECT: '{{.COMPOSE_PROJECT_NAME | default "bublik"}}'
  E2E_PROJECT: '{{.BUBLIK_E2E_COMPOSE_PROJECT_NAME | default (printf "%s-e2e" (.COMPOSE_PROJECT_NAME | default "bublik"))}}'
  E2E_READY_TIMEOUT: '{{.BUBLIK_E2E_READY_TIMEOUT | default "180"}}'
  E2E_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.db.yml
  E2E_COMPOSE: docker compose {{.E2E_COMPOSE_FILES}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ###########################################
  #         Git                             #
  ###########################################
  init:
    desc: Initialize Git submodules
    summary: Initialize and update all Git submodules recursively
    aliases: [i]
    status:
      - |
        # Check if all submodules are initialized and up to date
        test -z "$(git submodule status | grep '^-\|^+')"
    cmds:
      - git submodule init
      - git submodule update --init --recursive

  update:
    desc: Update Git submodules to latest commits
    summary: Update all Git submodules to their latest remote commits
    aliases: [u]
    status:
      - |
        # Check if any submodule needs updating
        test -z "$(git submodule status | grep '^+')"
    cmds:
      - git submodule update --remote

  ###########################################
  #         Docker Environment              #
  ###########################################
  docker:setup:
    desc: Setup Docker environment (copy env and settings files)
    summary: |
      Prepare Docker environment by copying necessary configuration files
      Uses BUBLIK_DOCKER_DATA_DIR from env
    aliases: [setup]
    deps: [check-deps]
    silent: true
    cmds:
      - task: docker:setup:env
      - task: docker:setup:django-settings

  docker:setup:django-settings:
    desc: Copy django settings template
    internal: true
    silent: true
    cmds:
      - ./scripts/setup_settings.sh

  docker:setup:env:
    desc: Copy .env.local to .env
    internal: true
    status:
      - test -f .env
    silent: true
    cmds:
      - ./scripts/setup_env.sh
      - task: docker:setup:env:uid

  docker:setup:env:uid:
    desc: Add host UID/GID to .env
    internal: true
    silent: true
    vars:
      HOST_UID:
        sh: id -u
      HOST_GID:
        sh: id -g
    cmds:
      - |
        OS_TYPE="$(uname -s)"

        if [ "$OS_TYPE" = "Darwin" ]; then
          if dscl . -read /Groups/www-data PrimaryGroupID 2>/dev/null | grep -q PrimaryGroupID; then
            GID_TO_USE=$(dscl . -read /Groups/www-data PrimaryGroupID | awk '{print $2}')
          else
            if dscl . -read /Groups/_www PrimaryGroupID 2>/dev/null | grep -q PrimaryGroupID; then
              GID_TO_USE=$(dscl . -read /Groups/_www PrimaryGroupID | awk '{print $2}')
              echo "ℹ️  Using macOS _www group (GID: $GID_TO_USE)"
            else
              echo "⚠️  Warning: Neither www-data nor _www group exists on this system"
              echo "Using your primary group (GID: {{.HOST_GID}}) instead"
              GID_TO_USE="{{.HOST_GID}}"
            fi
          fi
        else
          WWW_DATA_GID=$(getent group www-data 2>/dev/null | cut -d: -f3)
          if [ -z "$WWW_DATA_GID" ]; then
            echo "⚠️  Warning: www-data group does not exist on this system"
            echo "Please create it with: sudo groupadd -g 33 www-data"
            echo "Or add your user to an existing web server group"
            exit 1
          fi
          GID_TO_USE="$WWW_DATA_GID"
        fi

        if [ -f .env ]; then
          tmp_env=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ ! "$line" =~ ^HOST_(UID|GID)= ]]; then
              echo "$line" >> "$tmp_env"
            fi
          done < .env
          echo "HOST_UID={{.HOST_UID}}" >> "$tmp_env"
          echo "HOST_GID=$GID_TO_USE" >> "$tmp_env"
          mv "$tmp_env" .env
        fi

  docker:dev:watch:
    desc: Start development environment in watch mode
    summary: |
      Start development environment with live reload capability
      Environment will be accessible at {{.API_URL}}
    deps: [docker:setup]
    aliases: [dev:watch]
    cmds:
      - |
        eval "$(./scripts/git_version_env.sh ./bublik BUBLIK)"
        eval "$(./scripts/git_version_env.sh ./bublik-ui BUBLIK_UI)"
        docker compose -f docker-compose.dev.yml -f docker-compose.db.yml up --build --watch
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:dev:up:
    desc: Start development environment
    deps: [docker:setup]
    aliases: [dev:up]
    silent: true
    cmds:
      - |
        eval "$(./scripts/git_version_env.sh ./bublik BUBLIK)"
        eval "$(./scripts/git_version_env.sh ./bublik-ui BUBLIK_UI)"
        docker compose -f docker-compose.dev.yml -f docker-compose.db.yml up --build -d
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:dev:start:
    desc: Start development environment
    deps: [docker:setup]
    aliases: [dev:start]
    silent: true
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml start
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:start:
    desc: Start production environment
    deps: [docker:setup]
    aliases: [start]
    silent: true
    cmds:
      - docker compose -f docker-compose.yml start
      - echo "🚀 Development environment started at {{.API_URL}}"

  docker:up:
    desc: Start production environment
    summary: |
      Start production environment with optimized settings
      Environment will be accessible at BUBLIK_FQDN
    deps: [docker:setup]
    aliases: [up]
    silent: true
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml up --force-recreate -d
      - echo "🚀 Production environment started at {{.API_URL}}"

  docker:up:with-external-db:
    desc: Start production environment
    summary: |
      Start production environment with externally deployed database
      Environment will be accessible at BUBLIK_FQDN
    deps: [docker:setup]
    aliases: [up:with-external-db]
    silent: true
    cmds:
      - docker compose -f docker-compose.yml up --force-recreate -d
      - echo "🚀 Production environment started at {{.API_URL}}"

  docker:pull:
    desc: Pull Docker images
    aliases: [pull]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml pull

  docker:dev:stop:
    desc: Stop Docker development environment
    summary: Stop development containers while preserving data
    aliases: [dev:stop]
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml stop

  docker:stop:
    desc: Stop Docker production environment
    summary: Stop and remove production containers while preserving data
    aliases: [stop]
    cmds:
      - docker compose -f docker-compose.yml stop

  docker:down:
    desc: Stop Docker development environment
    summary: Stop and remove production containers while preserving data
    aliases: [down]
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.db.yml down

  docker:dev:down:
    desc: Stop Docker development environment
    summary: Stop and remove development containers while preserving data
    aliases: [dev:down]
    cmds:
      - docker compose -f docker-compose.dev.yml -f docker-compose.db.yml down

  management:redis:reset-cache:
    desc: Reset redis cache
    aliases: [reset-redis-cache]
    cmd: docker compose exec -it redis bash -c 'redis-cli flushall'

  management:shell:
    desc: Launch a bash shell inside the Django container for interactive management
    aliases: [shell]
    cmd: docker compose exec -it django bash

  management:delete-run:
    desc: Delete a test run from the database by providing its ID
    aliases: [delete-run]
    vars:
      ID: "{{.CLI_ARGS}}"
    cmd: docker compose exec -it django bash -c 'python manage.py delete_run -i {{ .ID }}'

  logs:import-log:
    desc: Import logs from a specified .tar file
    aliases: [import]
    summary: |
      Import logs from a specified .tar file
      Usage: task logs:import-log -- ./path/to/file.tar
    silent: true
    vars:
      FILE: "{{.CLI_ARGS}}"
    cmds:
      - ./scripts/import_logs.sh {{.FILE}}

  logs:import-log-remote:
    desc: Import log from remote URL
    aliases: [import-remote]
    vars:
      URL: "{{.CLI_ARGS}}"
    cmd: curl http://localhost/api/v2/importruns/source/?url={{.URL}}

  logs:import-via-command:
    desc: Import log from remote URL
    aliases: [import-command]
    vars:
      URL: "{{.CLI_ARGS}}"
    cmd: docker compose exec -it django bash -c 'python manage.py importruns {{ .URL }}'

  logs:publish-incoming-logs:
    desc: Publish logs from incoming directory
    aliases: [publish]
    silent: true
    cmds:
      - ./scripts/publish_logs.sh

  ###########################################
  #         Deps                          #
  ###########################################
  check-deps:
    desc: Check if system dependencies are installed
    summary: Verify that all required system and Docker dependencies are available
    cmds:
      - task: system:check-deps
      - task: docker:check-deps

  system:check-deps:
    desc: Check if system dependencies are installed
    internal: true
    silent: true
    cmds:
      - ./scripts/check_deps.sh system

  docker:check-deps:
    desc: Check if Docker and Docker Compose are installed
    internal: true
    silent: true
    cmds:
      - ./scripts/check_deps.sh docker

  ###########################################
  #         Shortcuts                       #
  ###########################################
  meta-categorization:
    desc: Trigger meta-categorization process
    summary: Start the meta-categorization process for test results
    cmd: docker compose exec -it django bash -c 'python manage.py meta_categorization'

  ###########################################
  #         Bootstrap                       #
  ###########################################
  bootstrap-dev:
    desc: Bootstrap the application and deploy to development environment
    summary: |
      Complete development deployment process:
      1. Start Docker containers in dev mode
      2. Initialize configurations
      3. Import initial sessions
      4. Display admin credentials
    preconditions:
      - test -f .env
      - test -f ./bublik/bublik/settings.py
    cmds:
      - task: docker:dev:up
      - cmd: echo "Waiting for 15 seconds for services to start..." && sleep 15
      - task: bootstrap:init-configs
      - task: bootstrap:import-sessions
      - task: bootstrap:print-credentials

  bootstrap:
    desc: Bootstrap the application and deploy to production
    summary: |
      Complete production deployment process:
      1. Start Docker containers
      2. Initialize configurations
      3. Import initial sessions
      4. Display admin credentials
    preconditions:
      - test -f .env
      - test -f ./bublik/bublik/settings.py
    cmds:
      - task: docker:up
      - cmd: echo "Waiting for 15 seconds for services to start..." && sleep 15
      - task: bootstrap:init-configs
      - task: print-env-info

  migrations:transition_1.8.0_to_1.9.0:
    desc: Handle migrations when updating to version 1.9.0 and higher from 1.8.0 and lower
    cmds:
      - ./scripts/create_migrations.sh

  print-env-info:
    desc: Print environment information
    silent: true
    cmds:
      - |
        echo "🔑 Admin credentials:"
        echo "  Email: {{.DJANGO_SUPERUSER_EMAIL}}"
        echo "  Password: {{.DJANGO_SUPERUSER_PASSWORD}}"
        echo "🔑 Data directory:"
        echo "  {{.BUBLIK_DOCKER_DATA_DIR}}"
        echo "🔑 INSTANCE URL:"
        echo "  {{.API_URL}}"

  bootstrap:import-sessions:
    desc: Import Test Sessions from specified file
    summary: |
      Import test sessions from a specified file containing URLs
      Usage: task bootstrap:import-sessions -- /path/to/import.txt
      Default file: bootstrap/import.txt
    deps: [auth:get-token]
    silent: true
    vars:
      IMPORT_FILE:
        sh: echo "${CLI_ARGS:-bootstrap/import.txt}"
    cmds:
      - ./scripts/import_sessions.sh "{{.API_URL}}" "{{.IMPORT_FILE}}"
      - defer: { task: auth:get-token:clean }

  bootstrap:init-configs:
    desc: Bootstrap Configs from specified directory
    summary: |
      Bootstrap configuration files from a specified directory
      Usage: task bootstrap:init-configs -- /path/to/config/dir
      Default directory: bootstrap/
    silent: true
    deps: [auth:get-token]
    vars:
      CONFIG_DIR:
        sh: echo "${CLI_ARGS:-bootstrap}"
    cmds:
      - ./scripts/bootstrap_configs.sh "{{.API_URL}}" "{{.EMAIL}}" "{{.PASSWORD}}" "{{.CONFIG_DIR}}" "{{.LOGS_URL}}"
      - defer: { task: auth:get-token:clean }

  auth:get-token:
    desc: Get access token by logging in
    summary: |
      Get authentication token by logging in with provided credentials
      Uses DJANGO_SUPERUSER_EMAIL and DJANGO_SUPERUSER_PASSWORD from env
    internal: true
    silent: true
    vars:
      EMAIL: '{{.DJANGO_SUPERUSER_EMAIL | default "admin@bublik.com"}}'
      PASSWORD: '{{.DJANGO_SUPERUSER_PASSWORD | default "admin"}}'
    cmds:
      - mkdir -p ./tmp
      - |
        echo "🔑 Logging in with {{.EMAIL}}..."
        response=$(curl -s -c ./tmp/cookies.txt "{{.API_URL}}/auth/login/" \
          -H 'Content-Type: application/json' \
          --data-raw "{\"email\":\"{{.EMAIL}}\",\"password\":\"{{.PASSWORD}}\"}")

        if grep -q "access_token" ./tmp/cookies.txt; then
          echo "✅ Successfully logged in"
          token=$(grep "access_token" ./tmp/cookies.txt | cut -f7)
          echo "$token" > ./tmp/.access_token
          echo "✅ Token saved to ./tmp/.access_token"
        else
          echo "❌ Login failed"
          echo "$response"
          exit 1
        fi

  auth:get-token:clean:
    desc: Clean up access token
    summary: Remove temporary authentication files
    internal: true
    cmds:
      - rm -f ./tmp/cookies.txt ./tmp/.access_token

  ###########################################
  #         Backup Operations              #
  ###########################################
  backup:create:
    desc: Create a complete backup of database and TE logs
    silent: true
    summary: |
      Create a complete backup archive containing database
      Usage: task backup:create -- /path/to/backup/dir
      Default directory: ./backups/
    cmds:
      - ./scripts/backup_operations.sh create {{.BACKUP_DIR}}

  backup:restore:
    desc: Restore database from a backup archive
    silent: true
    summary: |
      Restore complete backup from an archive
      Usage: task backup:restore -- /path/to/backup.tar.gz
    cmds:
      - ./scripts/backup_operations.sh restore {{.CLI_ARGS}}

  backup:list:
    desc: List available backup archives
    silent: true
    summary: |
      List all backup archives in the backup directory
      Usage: task backup:list -- /path/to/backup/dir
      Default directory: ./backups/
    cmds:
      - ./scripts/backup_operations.sh list {{.BACKUP_DIR}}

  ###########################################
  #         Docker Images                   #
  ###########################################
  docker:build-images:
    desc: Build Docker images
    summary: Build Runner, Log Server, and Nginx images
    aliases: [build]
    silent: true
    cmds:
      - task: docker:setup:django-settings
      - task: docker:build:runner
      - task: docker:build:log-server
      - task: docker:build:nginx

  docker:build:runner:
    desc: Build Runner image
    internal: true
    cmds:
      # Value-less --build-arg inherits from the environment, so commit summaries
      # never pass through shell quoting.
      - |
        eval "$(./scripts/git_version_env.sh ./bublik BUBLIK)"
        docker build \
          --network=host \
          --target runner \
          --build-arg URL_PREFIX=${URL_PREFIX} \
          --build-arg DOCS_URL=${DOCS_URL} \
          --build-arg BUBLIK_REPO_URL \
          --build-arg BUBLIK_REPO_BRANCH \
          --build-arg BUBLIK_REPO_TAG \
          --build-arg BUBLIK_COMMIT_REV \
          --build-arg BUBLIK_COMMIT_DATE \
          --build-arg BUBLIK_COMMIT_SUMMARY \
          --build-arg BUBLIK_BUILD_DATE \
          -t ${DOCKER_REGISTRY}/${DOCKER_ORG}/${RUNNER_IMAGE_NAME}:${IMAGE_TAG} \
          .

  docker:build:log-server:
    desc: Build Log Server image
    internal: true
    cmds:
      - >
        docker build
        --network=host
        --target log-server
        --build-arg URL_PREFIX=${URL_PREFIX}
        --build-arg DOCS_URL=${DOCS_URL}
        -t ${DOCKER_REGISTRY}/${DOCKER_ORG}/${LOG_SERVER_IMAGE_NAME}:${IMAGE_TAG}
        .

  docker:build:nginx:
    desc: Build Nginx image
    internal: true
    cmds:
      # DOCS_URL is deliberately not passed: nginx/Dockerfile declares no such ARG.
      - |
        eval "$(./scripts/git_version_env.sh ./bublik-ui BUBLIK_UI)"
        docker build \
          --network=host \
          --build-arg URL_PREFIX=${URL_PREFIX} \
          --build-arg BUBLIK_UI_REPO_BRANCH \
          --build-arg BUBLIK_UI_REPO_TAG \
          --build-arg BUBLIK_UI_COMMIT_REV \
          --build-arg BUBLIK_UI_COMMIT_DATE \
          --build-arg BUBLIK_UI_COMMIT_SUMMARY \
          -t ${DOCKER_REGISTRY}/${DOCKER_ORG}/${NGINX_IMAGE_NAME}:${IMAGE_TAG} \
          -f ./nginx/Dockerfile \
          .

  docker:push-images:
    desc: Push Docker images to registry
    summary: Push Runner, Log Server, and Nginx images to container registry
    aliases: [push]
    cmds:
      - docker push ${DOCKER_REGISTRY}/${DOCKER_ORG}/${RUNNER_IMAGE_NAME}:${IMAGE_TAG}
      - docker push ${DOCKER_REGISTRY}/${DOCKER_ORG}/${LOG_SERVER_IMAGE_NAME}:${IMAGE_TAG}
      - docker push ${DOCKER_REGISTRY}/${DOCKER_ORG}/${NGINX_IMAGE_NAME}:${IMAGE_TAG}

  ###########################################
  #         E2E                             #
  ###########################################
  # Four commands cover the loop:
  #
  #   task e2e:up     start the dedicated E2E stack and wait until it answers
  #   task e2e:seed   generate the fixture runs and import them
  #   task e2e:test   run the Playwright suite
  #   task e2e:down   stop the stack, keeping its data
  #
  # `task e2e:test:ui` is the same suite in Playwright's interactive runner,
  # for picking scenarios and watching them in a browser.
  #
  # `e2e:logs` and `e2e:types:check` have no `desc`, so they stay runnable but
  # only show up under `task --list-all`. Everything else the suite needs is a
  # `bublik-e2e` subcommand — call it directly rather than wrapping it here.
  #
  # E2E runs as its own Compose project against its own data directory, but the
  # Compose files still bind the normal host ports — stop the production stack
  # before starting this one.
  e2e:up:
    desc: Start the E2E stack and wait until every service answers
    summary: |
      Build the images, start the dedicated E2E stack, then wait until the API,
      UI, logs and Celery all answer. Seed it with `task e2e:seed`.

      The served UI is baked into the image, so bublik-ui changes reach the
      suite only through the rebuild this performs.
    # Anchor for the shared environment. A root-level `env:` would apply to
    # every task in this file — the production stack would follow E2E into its
    # Compose project — and task-level env does not propagate through a `task:`
    # call, so each E2E task has to carry it. Keep this task first: a YAML alias
    # cannot precede its anchor.
    env: &e2e-env
      COMPOSE_PROJECT_NAME: "{{.E2E_PROJECT}}"
      COMPOSE_FILES: "{{.E2E_COMPOSE_FILES}}"
      BUBLIK_DOCKER_DATA_DIR: "{{.E2E_DATA_DIR}}"
      BUBLIK_E2E_COMPOSE_PROJECT_NAME: "{{.E2E_PROJECT}}"
      BUBLIK_NORMAL_COMPOSE_PROJECT_NAME: "{{.E2E_NORMAL_PROJECT}}"
      BUBLIK_E2E_MANIFEST: "{{.E2E_MANIFEST}}"
      BUBLIK_E2E_PUBLISH_DIR: "{{.E2E_PUBLISH_DIR}}"
      BUBLIK_E2E_RESULTS_DIR: "{{.E2E_RESULTS_DIR}}"
      BUBLIK_E2E_RUN_LOG_SCHEMA: "{{.E2E_RUN_LOG_SCHEMA}}"
      BUBLIK_E2E_META_DATA_SCHEMA: "{{.E2E_META_DATA_SCHEMA}}"
      BUBLIK_E2E_URL: "{{.API_URL}}"
      BUBLIK_E2E_API_URL: "{{.API_URL}}"
      BUBLIK_E2E_READY_TIMEOUT: "{{.E2E_READY_TIMEOUT}}"
      # Consumed by the Playwright suite, which runs with dir: bublik-ui.
      BASE_URL: "{{.API_URL}}/v2/"
      BUBLIK_E2E_RUN_OVERVIEW: "../{{.E2E_MANIFEST}}"
    deps: [docker:setup]
    cmds:
      # Image tags do not depend on the Compose project, so the production build
      # task is the right one to reuse even though it runs without the env above.
      - task: docker:build-images
      - "{{.E2E_COMPOSE}} up --no-build -d"
      - ./scripts/e2e_ready.sh
      - echo "🚀 E2E stack ready at {{.API_URL}}"

  e2e:seed:
    desc: Generate the fixture runs and import them through the API
    summary: |
      Generate the fixture runs and import them, skipping bundles the instance
      already has, so this is cheap to re-run. Bundles planned with +ui are left
      for the Playwright import project.
      Override the plan: task e2e:seed -- --day "2026-04-21:basic.ok=1"
    env: *e2e-env
    vars:
      # Dedicated var, not CLI_ARGS directly, so a caller can blank it — the
      # special CLI_ARGS cannot be overridden.
      ARGS: '{{.ARGS | default .CLI_ARGS}}'
    # Skip when the instance already has the plan's runs — but never skip an
    # explicit override, which is asking for something the manifest cannot know.
    status:
      - '{{if trim .ARGS}}false{{else}}python3 scripts/e2e.py seeded{{end}}'
    cmds:
      - |
        {{if trim .ARGS}}bublik-e2e run --setup-projects {{.ARGS}}
        {{else}}bublik-e2e run --plan "{{.E2E_PLAN}}" --setup-projects{{end}}

  e2e:test:
    desc: Run the Playwright E2E suite against the stack
    summary: |
      Run the full suite (typecheck, feature-contract check, then the browser
      projects). Requires a seeded stack — run `task e2e:up && task e2e:seed`.
      Arguments after -- go to Playwright, e.g. task e2e:test -- --grep @smoke
      Interactive UI mode: task e2e:test:ui
    env: *e2e-env
    dir: bublik-ui
    deps: [e2e:types:check]
    preconditions:
      - sh: curl --fail --silent --show-error --max-time 5 "{{.API_URL}}/api/v2/"
        msg: "E2E stack is not reachable at {{.API_URL}} — run `task e2e:up` first"
    cmds:
      # Playwright directly rather than through nx: nx claims flags like
      # --project for itself, and the checks its target depends on already ran
      # above as e2e:types:check.
      - CI=1 pnpm exec playwright test --config apps/bublik/playwright.config.ts {{.CLI_ARGS}}

  e2e:test:ui:
    desc: Open the Playwright suite in the interactive UI runner
    summary: |
      Run the suite in Playwright's UI mode: it opens a browser tab where you
      pick scenarios, watch them execute, and step through the trace of a run.
      Requires a seeded stack — run `task e2e:up && task e2e:seed`.
      Arguments after -- go to Playwright, e.g. task e2e:test:ui -- --grep @smoke
      Cut the project list down with: E2E_BROWSERS=chromium task e2e:test:ui
    env: *e2e-env
    dir: bublik-ui
    # Playwright owns the terminal until the window is closed, and reads keys
    # from it.
    interactive: true
    preconditions:
      - sh: curl --fail --silent --show-error --max-time 5 "{{.API_URL}}/api/v2/"
        msg: "E2E stack is not reachable at {{.API_URL}} — run `task e2e:up` first"
    cmds:
      # Deliberately unlike e2e:test: no CI=1, which would swap the reporters
      # for the blob one and reject a `test.only` left in a file, and no
      # e2e:types:check dependency in front of an interactive session. Naming a
      # ui-host is what makes Playwright open the runner in the real browser
      # rather than its own bundled window; port 0 keeps two of these from
      # fighting over a port.
      - >
        pnpm exec playwright test --config apps/bublik/playwright.config.ts
        --ui --ui-host=127.0.0.1 --ui-port=0 {{.CLI_ARGS}}

  e2e:down:
    desc: Stop the E2E stack, keeping its database and fixtures
    summary: |
      Remove the E2E containers but keep their volumes, so the next
      `task e2e:up` starts with the same data and `task e2e:seed` is a no-op.
      Throw the data away too with: {{.E2E_COMPOSE}} down --volumes
    env: *e2e-env
    cmds:
      - "{{.E2E_COMPOSE}} down --remove-orphans"

  e2e:logs:
    summary: |
      Show logs from the dedicated E2E Compose project.
      Follow one service: task e2e:logs -- -f celery
    env: *e2e-env
    cmds:
      - "{{.E2E_COMPOSE}} logs {{.CLI_ARGS}}"

  e2e:types:check:
    summary: |
      Fail when the manifest types are stale, a feature scenario has no test,
      or the e2e code does not typecheck.
    cmds:
      # Quoted: the `run:` in the drift message would otherwise read as a
      # YAML mapping key.
      - 'bublik-e2e schema | diff -u bublik-ui/apps/bublik/e2e/support/e2e-manifest.schema.json - || (echo "Schema drift — regenerate with: bublik-e2e schema --out bublik-ui/apps/bublik/e2e/support/e2e-manifest.schema.json && (cd bublik-ui && pnpm run e2e:codegen)" && exit 1)'
      - cd bublik-ui && pnpm run e2e:codegen:check
      - cd bublik-ui && pnpm run e2e:features:check
      - cd bublik-ui && pnpm run e2e:typecheck
